# Available languages: en (default) or de.
language: en

checkout:
  # Time between successful checkouts.
  interval-days: 7
  # Used when randomized requirements are disabled.
  amount: 5
  item: EMERALD
  randomized:
    enabled: true
    # Include End-themed requirements in the built-in pool.
    include-end-items: false

ban:
  duration-days: 7
