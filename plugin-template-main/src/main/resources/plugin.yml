main: ${PACKAGE}.CheckoutPlugin
name: ${NAME}
version: "${VERSION}"
api-version: "1.21"
author: CrimsonWarpedcraft
description: Configurable recurring player checkouts that encourage server activity.
commands:
  payout:
    description: Opens your server checkout menu.
    usage: /payout
    aliases: [bezahlen]
  checkouttime:
    description: Shows the time remaining until your next checkout.
    usage: /checkouttime
    aliases: [zeit]
  checkouttest:
    description: Triggers a checkout ban for testing.
    usage: /checkouttest
    permission: giipscheckout.test
  checkoutreload:
    description: Reloads the plugin configuration.
    usage: /checkoutreload
    permission: giipscheckout.reload
  checkoutpayments:
    description: Shows the checkout payment overview.
    usage: /checkoutpayments
    aliases: [zahlungen]
    permission: giipscheckout.payments
permissions:
  giipscheckout.test:
    description: Allows use of the checkout ban test command.
    default: op
  giipscheckout.reload:
    description: Allows reloading the checkout configuration.
    default: op
  giipscheckout.payments:
    description: Allows viewing the payment overview.
    default: op
